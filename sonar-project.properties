# =====================================================================
# SonarQube / SonarCloud Project Configuration for Tax-AIS
# =====================================================================

sonar.projectKey=svinayaka_Tax-AIS
sonar.projectName=Tax-AIS
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src
sonar.tests=
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**,dist/**,src/assets/**,**/*.spec.ts,**/*.test.ts,**/*.d.ts
sonar.coverage.exclusions=**/*

# Code Analysis Rules & Languages
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate Wait (CI/CD)
sonar.qualitygate.wait=true
