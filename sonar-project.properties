# =====================================================================
# SonarQube / SonarCloud Project Configuration for Tax-AIS
# =====================================================================

sonar.projectKey=svinayaka_Tax-AIS
sonar.projectName=Tax-AIS
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src
sonar.tests=
sonar.sourceEncoding=UTF-8

# TypeScript & JavaScript Analysis Configuration
sonar.typescript.tsconfigPath=tsconfig.json
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.exclusions=node_modules/**,dist/**,src/assets/**,**/*.spec.ts,**/*.test.ts,**/*.d.ts
sonar.coverage.exclusions=**/*

# Code Quality & Cognitive Complexity Gate
sonar.qualitygate.wait=true
